<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unggah Laporan Maghrib Mengaji</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 30px 20px;
      background: #f9f9f9;
    }
    button {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #34a853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background: #2c8c44;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
    }
  </style>
</head>
<body>
  <h2>Unggah Laporan Maghrib Mengaji</h2>
  <button id="btn-photo">📷 Ambil Foto</button>
  <button id="btn-voice">🎙️ Rekam Suara</button>
  <p id="status"></p>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
