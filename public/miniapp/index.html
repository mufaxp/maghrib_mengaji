<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unggah Laporan Maghrib Mengaji</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 0;
      background: #f9f9f9;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: center;
    }
    #main-buttons {
      padding: 30px 20px;
    }
    button {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 18px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #34a853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      background: #2c8c44;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
      color: #555;
      padding: 0 20px;
    }
    #camera-container {
      display: none;
      position: relative;
      width: 100%;
      height: 100vh;
      background: black;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    video {
      width: 100%;
      height: calc(100vh - 100px);
      object-fit: contain;
      background: #000;
    }
    #camera-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      width: 100%;
      box-sizing: border-box;
      position: absolute;
      bottom: 0;
    }
    .cam-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 32px;
      padding: 10px 20px;
      cursor: pointer;
      background: none !important;
      box-shadow: none;
    }
    .cam-btn:active {
      opacity: 0.7;
    }
    #btn-close-camera {
      font-size: 28px;
      color: white;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="main-buttons">
    <h2>Unggah Laporan Maghrib Mengaji</h2>
    <button id="btn-photo">📷 Ambil Foto</button>
    <button id="btn-voice">🎙️ Rekam Suara</button>
    <p id="status"></p>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="camera-controls">
      <button id="btn-flip" class="cam-btn">🔄</button>
      <button id="btn-capture" class="cam-btn" style="font-size: 48px;">⏺️</button>
      <button id="btn-close-camera">✕</button>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
