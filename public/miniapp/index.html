<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unggah Laporan Maghrib Mengaji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="main-buttons">
    <h2>Unggah Laporan Maghrib Mengaji</h2>
    <button id="btn-photo">📷 Ambil Foto</button>
    <button id="btn-voice">🎙️ Rekam Suara</button>
    <p id="status"></p>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <div id="camera-controls">
      <button id="btn-flip" class="cam-btn">↺</button>
      <button id="btn-capture" class="cam-btn cam-btn-capture"></button>
      <button id="btn-close-camera" class="cam-btn">✕</button>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="script.js"></script>
</body>
</html>
